name: Build and deploy to the server

on:
  push:
    branches:
      - development

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install bun
        run: npm install -g bun@latest

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Copy build files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HYPERCE_SERVER_HOST }}
          username: ${{ secrets.HYPERCE_SERVER_USER }}
          key: ${{ secrets.HYPERCE_SERVER_KEY }}
          port: ${{ secrets.HYPERCE_SERVER_PORT }}
          source: 'dist'
          target: /home/${{ secrets.HYPERCE_SERVER_USER }}/wisko/backend/
          overwrite: true
          timeout: 120s
          command_timeout: 600s

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HYPERCE_SERVER_HOST }}
          username: ${{ secrets.HYPERCE_SERVER_USER }}
          key: ${{ secrets.HYPERCE_SERVER_KEY }}
          port: ${{ secrets.HYPERCE_SERVER_PORT }}
          timeout: 120s
          command_timeout: 600s
          script: |
            deploybackend --project wisko --branch development --pm bun --port 10020
