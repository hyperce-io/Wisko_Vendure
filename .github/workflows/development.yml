name: Build and deploy to the server

on:
  push:
    branches:
      - development

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install bun
        run: npm install -g bun@1.3.13

      # --frozen-lockfile fails the build when package.json and bun.lock disagree,
      # so the server always installs exactly what was built here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      # package.json and bun.lock go with dist: the server installs dependencies from
      # them, and without them it kept the old Vendure version while running new code.
      - name: Copy build files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HYPERCE_SERVER_HOST }}
          username: ${{ secrets.HYPERCE_SERVER_USER }}
          key: ${{ secrets.HYPERCE_SERVER_KEY }}
          port: ${{ secrets.HYPERCE_SERVER_PORT }}
          source: 'dist,ecosystem.config.cjs,package.json,bun.lock'
          target: /home/${{ secrets.HYPERCE_SERVER_USER }}/wisko/backend/
          overwrite: true
          timeout: 120s
          command_timeout: 600s

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HYPERCE_SERVER_HOST }}
          username: ${{ secrets.HYPERCE_SERVER_USER }}
          key: ${{ secrets.HYPERCE_SERVER_KEY }}
          port: ${{ secrets.HYPERCE_SERVER_PORT }}
          timeout: 120s
          command_timeout: 600s
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd $HOME/wisko/backend

            # Install exactly the dependencies dist was built against
            bun install --frozen-lockfile

            # Migrations run on startup (runMigrations in src/index.ts, from dist/migrations),
            # so there is no separate migration step here.

            # Restart using ecosystem config (has 3GB memory limit)
            pm2 delete wisko-backend || true
            PORT=10020 pm2 start ecosystem.config.cjs
            pm2 save --force

            # Fail the deploy if the server does not come back healthy
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null http://localhost:10020/health; then
                echo "Deployed successfully"
                exit 0
              fi
              sleep 5
            done
            echo "wisko-backend did not become healthy after deploy"
            pm2 logs wisko-backend --lines 50 --nostream
            exit 1
