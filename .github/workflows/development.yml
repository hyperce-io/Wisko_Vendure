name: Build and deploy to the server

on:
  push:
    branches:
      - development

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install bun
        run: npm install -g bun@latest

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Copy build files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HYPERCE_SERVER_HOST }}
          username: ${{ secrets.HYPERCE_SERVER_USER }}
          key: ${{ secrets.HYPERCE_SERVER_KEY }}
          port: ${{ secrets.HYPERCE_SERVER_PORT }}
          source: 'dist,ecosystem.config.cjs'
          target: /home/${{ secrets.HYPERCE_SERVER_USER }}/wisko/backend/
          overwrite: true
          timeout: 120s
          command_timeout: 600s

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HYPERCE_SERVER_HOST }}
          username: ${{ secrets.HYPERCE_SERVER_USER }}
          key: ${{ secrets.HYPERCE_SERVER_KEY }}
          port: ${{ secrets.HYPERCE_SERVER_PORT }}
          timeout: 120s
          command_timeout: 600s
          script: |
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            cd $HOME/wisko/backend
            
            # Install deps
            bun install
            
            # Run migrations
            bun run migration:run || true
            
            # Restart using ecosystem config (has 3GB memory limit)
            pm2 delete wisko-backend || true
            PORT=10020 pm2 start ecosystem.config.cjs
            pm2 save --force
            
            echo "Deployed successfully"
